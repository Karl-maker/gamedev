services:
  website:
    image: node:22-alpine
    working_dir: /app
    command: ["npm", "start", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3001:3000"
    volumes:
      - .:/app
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:3001
    restart: unless-stopped
